model:
  # base_learning_rate: 1e-5
  base_learning_rate: 5e-5
  # Stage 1 variant that removes the main UNet and trains the global U-Net alone
  target: ldm.models.diffusion.global_unet_only_outpaint.GlobalUNetOutpaintDiffusion
  params:
    # LR scheduler (InstanceDiffusion-style)
    scheduler_type: constant   # constant or cosine
    warmup_steps: 5000         # align with InstanceDiffusion example command
    # gradient_clip_val: 1.0
    gradient_clip_val: 0.0     # gradient clipping (global norm)
    weight_decay: 0.0         # AdamW weight decay for regularization
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    # Use global image as first-stage key so Stage 1 training targets the global frame directly
    first_stage_key: "global_image"
    cond_stage_key: "txt"
    image_size: 64
    channels: 4
    cond_stage_trainable: false   # Note: different from the one we trained before
    conditioning_key: hybrid   # important
    monitor: val/loss
    scale_factor: 0.18215
    use_ema: false
    finetune_keys: null
    # Global U-Net image key in dataloader/batch
    global_key: "global_image"

    # Global U-Net controls (IDM-VTON style)
    global_token_scale: 1.0      # scale applied to global tokens before self-attn
    save_attention_maps: false      # store debug attn maps per block (costs memory/time)
    train_global_unet: true           # include global U-Net params in optimizer
    train_unet: false               # freeze main UNet (train global U-Net only)
    global_lr_scale: 1.0         # lr multiplier for global U-Net
    # Extra supervised loss on the global U-Net: predict noise for noisy global-branch input
    global_noise_loss_weight: 1.0
    # Path to pretrained weights for the ID global U-Net (required for ID)
    global_pretrained_ckpt: "checkpoints/pretrained/inpainting/sd-v1-5-inpainting.ckpt"
    # InstanceDiffusion module-only checkpoint (fuser/UniFusion/ScaleU). Required for ID.
    global_modules_ckpt: "checkpoints/pretrained/InstanceDiffusion/instancediffusion_modules.pth"


    # Main inpainting UNet (9ch: latent4 + masked latent4 + mask1)
    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 64  # unused
        in_channels: 9
        out_channels: 4
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_heads: 8
        use_spatial_transformer: True
        transformer_depth: 1
        context_dim: 768
        use_checkpoint: False
        legacy: False

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256  # ?
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenCLIPEmbedder

    # Global U-Net: InstanceDiffusion UNet wrapped for global-branch usage
    global_stage_config:
      target: ldm.modules.global_unet.id_global_unet_wrapper.IDGlobalUNetWrapper
      params:
        unet_config:
          target: InstanceDiffusion.ldm.modules.diffusionmodules.openaimodel.UNetModel
          params:
            image_size: 64
            in_channels: 9
            out_channels: 4
            model_channels: 320
            attention_resolutions: [4, 2, 1]
            num_res_blocks: 2
            channel_mult: [1, 2, 4, 4]
            num_heads: 8
            transformer_depth: 1
            context_dim: 768
            use_checkpoint: True
            fuser_type: "gatedSA"        # Gated Self-Attn Dense
            efficient_attention: True   # Enabled: no instance mask used, pure speed gain
            inpaint_mode: False
        grounding_tokenizer:
          target: InstanceDiffusion.ldm.modules.diffusionmodules.text_grounding_net.UniFusion
          params:
            in_dim: 768
            out_dim: 768          # must match UNet context_dim
            mid_dim: 3072
            # Only boxes enabled; others disabled
            train_add_boxes: true
            train_add_points: false
            train_add_scribbles: false
            train_add_masks: false
            test_drop_boxes: false
            test_drop_points: false
            test_drop_scribbles: false
            test_drop_masks: false
            use_seperate_tokenizer: true

# Grounding input helper for CFG training (10% random drop)
grounding_tokenizer_input:
  target: InstanceDiffusion.grounding_input.text_grounding_tokinzer_input.GroundingNetInput
